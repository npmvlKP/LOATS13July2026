# ADR-0014 (defense-in-depth gitleaks pre-push net): the hook inventory
# below includes a pre-push-stage net, so installs must create the
# pre-push shim too (a bare `pre-commit install` otherwise creates only
# pre-commit + commit-msg, which is exactly the silent pre-push death
# found on the dev host: .git/hooks had no pre-push hook at all).
default_install_hook_types: [pre-commit, commit-msg, pre-push]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        # Frozen audit evidence (docs/audit-history/, reports/ai-generated/)
        # must never be rewritten by fixer hooks: --all-files passes every
        # tracked filename explicitly and the underlying tools ignore their
        # own exclude configs for explicit paths (the same bypass that hit
        # the flake8 hook). pre-commit's hook-level exclude DOES apply in
        # that mode — it is the correct filtering layer. Pinned by
        # TestFixerHooksSpareFrozenEvidence in tests/test_repo_hygiene.py.
        exclude: ^docs/audit-history/|^reports/ai-generated/
      - id: end-of-file-fixer
        exclude: ^docs/audit-history/|^reports/ai-generated/
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
      - id: debug-statements
      - id: name-tests-test
        args: [--pytest-test-first]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.5
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        exclude: ^docs/audit-history/|^reports/ai-generated/
      - id: ruff-format
        exclude: ^docs/audit-history/|^reports/ai-generated/

  # ADR-0013: Windows cannot record exec bits, so a shebang'd script
  # staged from Windows lands at 100644 and fails the Linux CI EXE001
  # gate. This hook flips staged shebang'd *.py to 100755 in the index
  # (self-healing; CI EXE001 stays the hard verifier of record).
  - repo: local
    hooks:
      - id: shebang-exec-bit
        name: shebang exec-bit normalizer (ADR-0013)
        entry: python scripts/ensure_shebang_exec_bit.py
        language: system
        types: [python]
        pass_filenames: true

  # mypy: Behavioral + version lockstep with CI. A language:system local
  # hook runs the venv's pinned mypy (== pyproject pin) with the same
  # config and directory target as the CI mypy job, avoiding both the
  # dual module naming (loats.* vs src.loats.*) a file-path target
  # produces under mypy 2.x and the dependency duplication of
  # additional_dependencies in the isolated hook env.
  - repo: local
    hooks:
      - id: mypy
        name: mypy (strict, pyproject config)
        entry: python -m mypy
        args: [--strict, --config-file, pyproject.toml, src/]
        language: system
        pass_filenames: false

  - repo: https://github.com/PyCQA/flake8
    rev: 7.3.0
    hooks:
      - id: flake8

  # bandit: Use system language to avoid Windows cp1252 encoding bug
  # in pre-commit's isolated virtualenv.
  - repo: local
    hooks:
      - id: commit-message-check
        name: commit message validation
        entry: python scripts/commit_message_check.py
        language: system
        stages: [commit-msg]
        pass_filenames: true

  - repo: local
    hooks:
      - id: bandit
        name: bandit (security scan)
        entry: python -m bandit
        args: ["-r", "src/", "-c", "pyproject.toml", "-q"]
        language: system
        pass_filenames: false

  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: pytest
        language: system
        pass_filenames: false
        args: [--cov, --cov-fail-under=80, --cov-report=term-missing, --cov-report=json]
        stages: [pre-push]

      - id: per-module-coverage
        name: per-module coverage check
        entry: python scripts/check_per_module_coverage.py
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: pip-audit
        name: pip-audit
        # ADR-0010: the nltk advisory fires from the audit toolchain's own
        # dev-tree transitive; CI carries the identical --ignore-vuln. The
        # hook surface must match or every pre-push fails closed here.
        entry: pip-audit --ignore-vuln PYSEC-2026-3740
        language: system
        pass_filenames: false
        stages: [pre-push]

      # ADR-0014: defense-in-depth secret net. The repo config
      # (.gitleaks.toml) allowlists .env.test ON PURPOSE, so the CI job
      # that loads it can never re-flag the 14Jul/26Aug .env.test blob
      # class; this hook scans the push's introduced commits under PURE
      # default rules (no allowlist) and fails the push closed on a
      # leak or a missing gitleaks binary. pre-commit consumes the
      # pre-push stdin itself (hook_impl._run_ns), so the script never
      # reads stdin: it scans `git rev-list --branches --not --remotes`
      # directly (pre-commit's own fallback uses the same --not
      # --remotes range semantics).
      - id: gitleaks-prepush
        name: gitleaks default-rules pre-push secret net
        entry: python scripts/gitleaks_prepush.py
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: deps-sync
        name: dependency manifest sync
        entry: python scripts/check_deps_sync.py
        language: system
        pass_filenames: false
        files: ^(pyproject\.toml|requirements-core\.txt)$

      - id: repo-hygiene
        name: repo hygiene (no tracked venvs / junk / env files)
        entry: python scripts/check_repo_hygiene.py
        language: system
        pass_filenames: false

      - id: scripts-wiring
        name: scripts wiring (no orphan scripts / back-references)
        entry: python scripts/check_scripts_wiring.py
        language: system
        pass_filenames: false

      - id: env-settings-sync
        name: .env.example vs Settings sync
        entry: python scripts/check_env_settings_sync.py
        language: system
        pass_filenames: false
        files: ^(\.env\.example|src/loats/config/settings\.py)$

      - id: src-ascii
        name: src ascii conformance (test-pinned payloads allowlisted)
        entry: python scripts/check_src_ascii.py
        language: system
        pass_filenames: false
        files: ^src/.*\.py$
