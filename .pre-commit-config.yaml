repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
      - id: debug-statements
      - id: name-tests-test
        args: [--pytest-test-first]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.5
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  # mypy: Behavioral + version lockstep with CI. A language:system local
  # hook runs the venv's pinned mypy (== pyproject pin) with the same
  # config and directory target as the CI mypy job, avoiding both the
  # dual module naming (loats.* vs src.loats.*) a file-path target
  # produces under mypy 2.x and the dependency duplication of
  # additional_dependencies in the isolated hook env.
  - repo: local
    hooks:
      - id: mypy
        name: mypy (strict, pyproject config)
        entry: python -m mypy
        args: [--strict, --config-file, pyproject.toml, src/]
        language: system
        pass_filenames: false

  - repo: https://github.com/PyCQA/flake8
    rev: 7.3.0
    hooks:
      - id: flake8

  # bandit: Use system language to avoid Windows cp1252 encoding bug
  # in pre-commit's isolated virtualenv.
  - repo: local
    hooks:
      - id: commit-message-check
        name: commit message validation
        entry: python scripts/commit_message_check.py
        language: system
        stages: [commit-msg]
        pass_filenames: true

  - repo: local
    hooks:
      - id: bandit
        name: bandit (security scan)
        entry: python -m bandit
        args: ["-r", "src/", "-c", "pyproject.toml", "-q"]
        language: system
        pass_filenames: false

  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: pytest
        language: system
        pass_filenames: false
        args: [--cov, --cov-fail-under=80, --cov-report=term-missing, --cov-report=json]
        stages: [pre-push]

      - id: per-module-coverage
        name: per-module coverage check
        entry: python scripts/check_per_module_coverage.py
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: pip-audit
        name: pip-audit
        entry: pip-audit
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: deps-sync
        name: dependency manifest sync
        entry: python scripts/check_deps_sync.py
        language: system
        pass_filenames: false
        files: ^(pyproject\.toml|requirements-core\.txt)$

      - id: repo-hygiene
        name: repo hygiene (no tracked venvs / junk / env files)
        entry: python scripts/check_repo_hygiene.py
        language: system
        pass_filenames: false

      - id: env-settings-sync
        name: .env.example vs Settings sync
        entry: python scripts/check_env_settings_sync.py
        language: system
        pass_filenames: false
        files: ^(\.env\.example|src/loats/config/settings\.py)$
