# LOATS13July2026 - LITE Docker Compose Configuration for RUNTIME
# LITE Philosophy: No Docker services, no heavy ML, pure Python
# This compose file is for PRODUCTION RUNTIME deployment
#
# For CI/CD testing, use docker-compose.yml instead
#
# LITE: No Redis, no Prometheus, no external service dependencies

services:
  # LOATS Application - Lightweight options analysis (RUNTIME mode)
  loats:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: loats13july2026
    restart: unless-stopped
    environment:
      # OpenAlgo Configuration (set these in .env)
      - OPENALGO_API_KEY=${OPENALGO_API_KEY}
      - OPENALGO_BASE_URL=${OPENALGO_BASE_URL:-http://host.docker.internal:5000}
      - OPENALGO_MODE=ANALYZE
      # Python environment
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - TZ=Asia/Kolkata
    env_file:
      - .env
    volumes:
      # Mount logs directory
      - loats_logs:/app/logs
      # Mount audit database
      - loats_data:/app/data
    ports:
      - "8001:8001"  # Prometheus metrics server
    healthcheck:
      test: ["CMD", "python", "quick_health_check.py"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - loats_network
    # Resource limits (LITE = minimal footprint)
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
    # Security: read-only root filesystem
    read_only: true
    # Security: no new privileges
    security_opt:
      - no-new-privileges:true
    # Stop signal for graceful shutdown
    stop_grace_period: 10s
    # RUNTIME MODE: Start the actual trading system
    command: ["python", "-m", "loats.main"]

networks:
  loats_network:
    driver: bridge
    # Internal network only - no external access
    internal: false

volumes:
  loats_logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /app/logs
  loats_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /app/data
