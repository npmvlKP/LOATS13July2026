name: Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  TZ: Asia/Kolkata
  PYTHONDONTWRITEBYTECODE: 1
  PYTHONUNBUFFERED: 1

jobs:
  # ================================================================
  # 5a REQUIRED CHECKS — green now, enforced from wave start
  # Each job name = branch-protection required_status_check context
  # ================================================================
  deps-sync:
    name: deps-sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"
      - name: Check dependency manifest sync
        run: python scripts/check_deps_sync.py

  repo-hygiene:
    name: repo-hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reject tracked venvs / junk / env files (F8-C-02)
        run: python scripts/check_repo_hygiene.py

  ruff-lint:
    name: ruff-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "ruff==0.16.5"
      - name: Run Ruff linter
        run: ruff check src/ tests/ scripts/ --config pyproject.toml --output-format=github

  ruff-repo-scope:
    name: ruff-repo-scope (repository root)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "ruff==0.16.5"
      - name: Run Ruff linter (repository root scope)
        run: ruff check . --config pyproject.toml --output-format=github

  ruff-format:
    name: ruff-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "ruff==0.16.5"
      - name: Run Ruff formatter
        run: ruff format --check src/ tests/ scripts/ --config pyproject.toml

  isort:
    name: isort
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install isort
      - name: Run isort
        run: isort --check-only src/ tests/ scripts/ --settings-path pyproject.toml

  flake8:
    name: flake8
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8
      - name: Run Flake8
        run: flake8 src/ tests/ scripts/

  bandit:
    name: bandit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install bandit
      - name: Run Bandit
        run: bandit -r src/ -f json -o bandit-report.json
      - name: Upload bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json
          retention-days: 30

  # ================================================================
  # 5b CHECKS — required for merge at wave end (TODO-5b)
  # ================================================================
  commit-lint:
    name: commit-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate commit messages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Determine commit range
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ] && [ -n "$BASE_SHA" ] && [ -n "$HEAD_SHA" ]; then
            RANGE="${BASE_SHA}..${HEAD_SHA}"
          else
            RANGE="HEAD~1..HEAD"
          fi
          echo "Checking commits in range: $RANGE"
          FAILED=0
          for phrase in \
            "ready for deployment" \
            "production ready" \
            "ready for production" \
            "deployment ready" \
            "production-ready" \
            "deployment-ready" \
            "fully compliant" \
            "FULLY COMPLIANT"
          do
            MATCHES=$(git log --format="%H %s" $RANGE | grep -i "$phrase" || true)
            if [ -n "$MATCHES" ]; then
              echo "FAIL: prohibited phrase found: '$phrase'"
              echo "$MATCHES"
              FAILED=1
            fi
          done
          if [ "$FAILED" = "1" ]; then
            echo ""
            echo "ERROR: One or more commits contain prohibited phrases."
            echo "See CONTRIBUTING.md for commit message guidelines."
            exit 1
          fi
          echo "All commit messages validated successfully."

  mypy:
    name: mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"
      - name: Run MyPy
        run: mypy src/ --strict --config-file pyproject.toml --output-format=github

  pytest-coverage:
    name: pytest-coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"
      - name: Run pytest with coverage
        run: |
          pytest tests/ \
            --cov=src \
            --cov-branch \
            --cov-fail-under=80 \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-report=json:coverage.json \
            --junitxml=pytest-report.xml
      - name: Check per-module coverage
        run: python scripts/check_per_module_coverage.py
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.xml
            pytest-report.xml
          retention-days: 30

  pip-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Run pip-audit
        run: pip-audit --format=json --output-file pip-audit-report.json
      - name: Upload pip-audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-report
          path: pip-audit-report.json
          retention-days: 30

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        with:
          config: .gitleaks.toml
          fail-on: secrets
          exit-code: 1
          verbose: true

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Build Test
        run: |
          docker build -t loats13july2026:test .
          docker run --rm --name loats-health-test loats13july2026:test python -c "import sys;print('Health Check Passed')" || exit 1
          docker stop loats-health-test || true
