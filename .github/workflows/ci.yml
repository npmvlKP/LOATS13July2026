name: Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  TZ: Asia/Kolkata
  PYTHONDONTWRITEBYTECODE: 1
  PYTHONUNBUFFERED: 1

jobs:
  quality-gates:
    name: Quality Gates
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: [3.12]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"
      - name: Check dependency manifest sync
        run: python scripts/check_deps_sync.py
      - name: Run Ruff linter
        run: ruff check src/ tests/ scripts/ --config pyproject.toml --output-format=github
      - name: Run Ruff formatter
        run: ruff format --check src/ tests/ scripts/ --config pyproject.toml
      - name: Run isort
        run: isort --check-only src/ tests/ scripts/ --settings-path pyproject.toml
      - name: Run Flake8
        run: flake8 src/ tests/ scripts/
      - name: Run MyPy
        run: mypy src/ --strict --config-file pyproject.toml --output-format=github
      - name: Run Bandit
        run: bandit -r src/ -f json -o bandit-report.json
      - name: Run pip-audit
        run: pip-audit --format=json --output-file pip-audit-report.json
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        with:
          config: .gitleaks.toml
          fail-on: secrets
          exit-code: 1
          verbose: true

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            bandit-report.json
            pip-audit-report.json
          retention-days: 30

  tests:
    name: Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: [3.12]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"
      - name: Run pytest
        run: |
          pytest tests/ \
            --cov=src \
            --cov-branch \
            --cov-fail-under=80 \
            --cov-report=xml \
            --cov-report=term-missing \
            --junitxml=pytest-report.xml
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.xml
            pytest-report.xml
          retention-days: 30

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Build Test
        run: |
          docker build -t loats13july2026:test .
          docker run --rm --name loats-health-test loats13july2026:test python -c "import sys;print('Health Check Passed')" || exit 1
          docker stop loats-health-test || true

  status:
    name: Final Status
    runs-on: ubuntu-latest
    needs: [quality-gates, tests]
    if: always()
    steps:
      - name: Check Status
        run: |
          if [[ "${{ needs.quality-gates.result }}" == "failure" || "${{ needs.tests.result }}" == "failure" ]]; then
            echo "Pipeline Failed"
            exit 1
          fi
          echo "Pipeline Passed"