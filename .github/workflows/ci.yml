name: Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  TZ: Asia/Kolkata
  PYTHONDONTWRITEBYTECODE: 1
  PYTHONUNBUFFERED: 1

# Job topology (2026-09-07): all jobs run in PARALLEL — there is no
# aggregate "final status" job. Merge blocking is enforced exclusively by
# branch protection on main (required_status_checks, strict); the
# required-context list is documented in CONTRIBUTING.md and must list
# every job that gates a merge.
#
# Action majors are pinned to Node-24-native releases: GitHub removes the
# Node 20 runtime from hosted runners on 2026-09-16, after which Node-20
# actions fail regardless of ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION.
# Verified Node 24 majors: checkout@v5+ (latest v7), setup-python@v6+
# (latest v7), upload-artifact@v6+ (latest v7), gitleaks-action@v3.
jobs:
  # ================================================================
  # 5a REQUIRED CHECKS — green now, enforced from wave start
  # Each job name = branch-protection required_status_check context
  # ================================================================
  deps-sync:
    name: deps-sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"
      - name: Check dependency manifest sync
        run: python scripts/check_deps_sync.py

  repo-hygiene:
    name: repo-hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Reject tracked venvs / junk / env files (F8-C-02)
        run: python scripts/check_repo_hygiene.py
      - name: Reject orphan scripts / back-references (F8-L-06-R2)
        run: python scripts/check_scripts_wiring.py
      - name: Reject non-ASCII source outside test-pinned payloads
        run: python scripts/check_src_ascii.py

  rss-feeds:
    name: rss-feeds (F8-L-05 recorded fallback)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
      # H1 (adversarial review 2026-09-04): the validator imports the loats
      # package (structlog, pydantic_settings), so deps MUST be installed
      # even though feed validation itself needs no feed network.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .
      - name: Validate recorded RSS manifest (no feed network required)
        run: python scripts/validate_rss_feeds.py --offline
      # The manifest <-> settings.rss_feeds lockstep and defunct-feed guard
      # are asserted by tests/test_rss_validation.py::TestLiveRepositoryContract,
      # executed by the pytest-coverage job.

  ruff-lint:
    name: ruff-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "ruff==0.16.5"
      - name: Run Ruff linter
        run: ruff check src/ tests/ scripts/ --config pyproject.toml --output-format=github

  ruff-repo-scope:
    name: ruff-repo-scope (repository root)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "ruff==0.16.5"
      - name: Run Ruff linter (repository root scope)
        run: ruff check . --config pyproject.toml --output-format=github

  ruff-format:
    name: ruff-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "ruff==0.16.5"
      - name: Run Ruff formatter
        run: ruff format --check src/ tests/ scripts/ --config pyproject.toml

  isort:
    name: isort
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "isort==9.0.1"
      - name: Run isort
        run: isort --check-only src/ tests/ scripts/ --settings-path pyproject.toml

  flake8:
    name: flake8
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "flake8==7.3.0"
      - name: Run Flake8
        run: flake8 src/ tests/ scripts/

  bandit:
    name: bandit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "bandit==1.9.4"
      - name: Run Bandit
        # -c pyproject.toml mirrors the pre-commit bandit hook and the
        # security.yml job (the config carries the B101 skip); bandit exits
        # 0 on scan success, findings live in the JSON payload.
        run: bandit -r src/ -c pyproject.toml -f json -o bandit-report.json
      - name: Upload bandit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bandit-report
          path: bandit-report.json
          retention-days: 30

  # ================================================================
  # 5b CHECKS — required for merge at wave end (TODO-5b)
  # ================================================================
  commit-lint:
    name: commit-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Validate commit messages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Determine commit range
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ] && [ -n "$BASE_SHA" ] && [ -n "$HEAD_SHA" ]; then
            RANGE="${BASE_SHA}..${HEAD_SHA}"
          else
            RANGE="HEAD~1..HEAD"
          fi
          echo "Checking commits in range: $RANGE"
          FAILED=0
          for phrase in \
            "ready for deployment" \
            "production ready" \
            "ready for production" \
            "deployment ready" \
            "production-ready" \
            "deployment-ready" \
            "fully compliant" \
            "FULLY COMPLIANT"
          do
            MATCHES=$(git log --format="%H %s" $RANGE | grep -i "$phrase" || true)
            if [ -n "$MATCHES" ]; then
              echo "FAIL: prohibited phrase found: '$phrase'"
              echo "$MATCHES"
              FAILED=1
            fi
          done
          if [ "$FAILED" = "1" ]; then
            echo ""
            echo "ERROR: One or more commits contain prohibited phrases."
            echo "See CONTRIBUTING.md for commit message guidelines."
            exit 1
          fi
          echo "All commit messages validated successfully."

  mypy:
    name: mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        # Editable install is REQUIRED for the gates below: --cov=src must
        # measure the checkout's source files (a non-editable install made
        # coverage report 0% on GitHub runners), and repo-relative fixtures
        # (tests/fixtures/rss) must resolve from the installed package.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run MyPy
        # mypy 2.3.1 (the pinned version) has no --output-format flag; -O/--output
        # accepts only json. Plain default output keeps the job runnable and the
        # non-zero exit contract intact (verified against mypy==2.3.1).
        run: mypy src/ --strict --config-file pyproject.toml

  pytest-coverage:
    name: pytest-coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        # Editable install: same parity contract as the mypy job above.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run pytest with coverage
        run: |
          pytest tests/ \
            --cov=src \
            --cov-branch \
            --cov-fail-under=80 \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-report=json:coverage.json \
            --junitxml=pytest-report.xml
      - name: Check per-module coverage
        run: python scripts/check_per_module_coverage.py
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            coverage.xml
            pytest-report.xml
          retention-days: 30

  pip-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install project (production closure)
        # The audit must run against THIS project's dependency closure.
        # A bare `pip install pip-audit` environment audits only pip-audit's
        # own deps — a vacuous gate (contributing: zero vulnerabilities
        # against production dependencies is the standard).
        run: |
          python -m pip install --upgrade pip
          pip install .
      - name: Install pip-audit
        run: pip install "pip-audit==2.10.1"
      - name: Run pip-audit
        # Environment mode: audits the installed production closure of the
        # project (above). Per ADR-0010, PYSEC-2026-3740 (nltk, dev-toolchain
        # only via `safety`) is waived HERE and in HC-11; the waiver is
        # meaningless anywhere safety is absent, and any future RUNTIME
        # advisory still fails this job.
        run: |
          pip-audit --format=json --output pip-audit-report.json --ignore-vuln PYSEC-2026-3740
      - name: Upload pip-audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pip-audit-report
          path: pip-audit-report.json
          retention-days: 30

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        # gitleaks-action@v2 hard-requires GITHUB_TOKEN for PR scanning (without
        # it the job fails with "GITHUB_TOKEN is now required to scan pull
        # requests"); its with: inputs (config/fail-on/exit-code/verbose) are
        # not valid inputs for this action and are ignored with a warning.
        # .gitleaks.toml is picked up from the repo root automatically.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        uses: gitleaks/gitleaks-action@v2

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
      - name: Build Test
        run: |
          docker build -t loats13july2026:test .
          docker run --rm --name loats-health-test loats13july2026:test python -c "import sys;print('Health Check Passed')" || exit 1
          docker stop loats-health-test || true
