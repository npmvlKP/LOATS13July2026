# LOATS13July2026 - Security Scanning Workflow
# Runs on schedule and manual trigger for security audits

name: Security Scan

on:
  schedule:
    # Run security scan weekly on Sunday at 3 AM IST
    - cron: '30 21 * * 0'  # 3:00 AM IST = 21:30 UTC Saturday
  workflow_dispatch:
    inputs:
      scan_type:
        description: 'Type of security scan'
        required: true
        default: 'full'
        type: choice
        options:
          - full
          - secrets
          - dependencies
          - code

env:
  TZ: Asia/Kolkata

jobs:
  # ============================================================
  # Secret Scanning with Gitleaks
  # ============================================================
  secrets-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    # Scheduled runs execute the full-history secret scan (the reason the
    # weekly cron exists); manual runs honor the scan_type selector.
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (github.event.inputs.scan_type == 'full' || github.event.inputs.scan_type == 'secrets' || github.event.inputs.scan_type == ''))

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        # gitleaks-action@v3 is the Node-24 runtime release; @v2 stops
        # working when GitHub removes Node 20 from hosted runners
        # (2026-09-16). v3 changes no inputs or behavior. GITLEAKS_CONFIG
        # is the documented variable for a non-default config path;
        # ENABLE_COMMENTS/ENABLE_PROPOSAL are not v3 variables.
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  # ============================================================
  # Dependency Vulnerability Scanning
  # ============================================================
  dependency-scan:
    name: Dependency Vulnerabilities
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (github.event.inputs.scan_type == 'full' || github.event.inputs.scan_type == 'dependencies' || github.event.inputs.scan_type == ''))

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install project (production closure)
        # pip-audit needs a project environment to audit; a bare
        # `pip install pip-audit` environment contains only the auditor.
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Install pip-audit
        run: pip install "pip-audit==2.10.1"

      - name: Run pip-audit (environment mode — audits the project closure)
        # Per ADR-0010: the nltk advisory (PYSEC-2026-3740) fires only in
        # environments containing `safety`; CI never installs safety, so the
        # waiver is a no-op here kept solely to keep HC-11 and this job on
        # one contract. Any future runtime advisory still fails the scan.
        run: |
          pip-audit --format=json --output pip-audit-full.json --ignore-vuln PYSEC-2026-3740

      - name: Upload pip-audit report
        uses: actions/upload-artifact@v7
        with:
          name: pip-audit-full-report
          path: pip-audit-full.json
          retention-days: 30

      - name: Fail on critical vulnerabilities
        if: github.event.inputs.scan_type == 'full' || github.event_name == 'schedule'
        run: |
          # pip-audit JSON is {"dependencies": [...]}; it carries no severity
          # field, so gate on the PRESENCE of advisories, not on a grep for
          # "CRITICAL" (which can never match this format).
          CRIT=$(python - <<'PY'
          import json, sys
          try:
              data = json.load(open("pip-audit-full.json", encoding="utf-8"))
          except (OSError, ValueError):
              sys.exit("pip-audit-full.json missing or unparseable")
          hits = [f"{d['name']} {d['version']}" for d in data.get("dependencies", []) for v in d.get("vulns", [])]
          if hits:
              print("\n".join(hits))
              sys.exit(1)
          print("0 vulnerable distributions")
          PY
          )
          echo "$CRIT"

  # ============================================================
  # Code Security Analysis with Bandit
  # ============================================================
  code-security:
    name: Code Security Analysis
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (github.event.inputs.scan_type == 'full' || github.event.inputs.scan_type == 'code' || github.event.inputs.scan_type == ''))

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Install Bandit
        run: pip install "bandit==1.9.4" "safety==3.8.1"

      - name: Run Bandit
        # Bandit always exits 0 on scan success — findings live in the JSON
        # payload, not the exit code. Gate on the payload's metrics block
        # ({"metrics": {"_totals": {"SEVERITY.HIGH": N}}}); a severity grep
        # can never match this format and silently never fails.
        run: |
          bandit -r src/ -c pyproject.toml -f json -o bandit-full-report.json
          bandit -r src/ -c pyproject.toml -f screen
          HIGH=$(python - <<'PY'
          import json, sys
          data = json.load(open("bandit-full-report.json", encoding="utf-8"))
          high = data.get("metrics", {}).get("_totals", {}).get("SEVERITY.HIGH", 0)
          if high:
              print(f"{high} high-severity bandit finding(s) - failing")
              sys.exit(1)
          print("0 high-severity bandit findings")
          PY
          )
          echo "$HIGH"

      # safety>=3 dropped the v2 flags (`--json`, `--output-file`); `scan` needs
      # platform auth this workflow does not have. `check --save-json` keeps the
      # artifact contract with the auth-free path (verified: safety 3.8.1).
      # 2026-09-07: `safety>=3,<4` resolved to a future 3.x that removed the
      # `check` command — pin to the verified version (same class of drift the
      # workflow-flag-currency tests guard against).
      - name: Run Safety check
        run: |
          safety check --save-json safety-report.json

      - name: Upload security reports
        uses: actions/upload-artifact@v7
        with:
          name: code-security-reports
          path: |
            bandit-full-report.json
            safety-report.json
          retention-days: 30

  # ============================================================
  # SBOM Generation (Software Bill of Materials)
  # ============================================================
  sbom:
    name: SBOM Generation
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (github.event.inputs.scan_type == 'full' || github.event.inputs.scan_type == 'dependencies' || github.event.inputs.scan_type == ''))

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install CycloneDX
        run: pip install "cyclonedx-bom==7.3.1"

      - name: Generate SBOM
        # cyclonedx-bom 7.x: `mod` is not a subcommand. `requirements` reads a
        # pip requirements file (positional, `-` for stdin; default
        # requirements.txt); `pip freeze --all` feeds the FULL environment
        # (prod + dev tools) and `--of` selects the output format (validated
        # against cyclonedx-bom 7.3.1).
        run: |
          pip freeze --all | cyclonedx-py requirements - -o sbom.json
          pip freeze --all | cyclonedx-py requirements - --of XML -o sbom.xml

      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: |
            sbom.json
            sbom.xml
          retention-days: 90

      - name: Upload SBOM to GitHub
        uses: actions/upload-artifact@v7
        with:
          name: sbom-github
          path: sbom.json
          retention-days: 365

  # ============================================================
  # Summary Report
  # ============================================================
  # The summary gate derives its required-leg set from the scan_type
  # selector: a leg that concluded "skipped" was deliberately not
  # selected, so it never gates the summary. Pinned defect (run
  # 34438112203): the gate demanded literal success from all three
  # scan legs even when the selector skipped them, so every selector
  # dispatch reported a false summary failure. Any leg that RAN and
  # did not succeed still fails the summary, and a run where zero legs
  # executed is a configuration error, not a pass. Pinned by
  # TestSecuritySummaryGateSelectorParity in tests/test_repo_hygiene.py.
  summary:
    name: Security Scan Summary
    runs-on: ubuntu-latest
    needs: [secrets-scan, dependency-scan, code-security, sbom]
    if: always() && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')

    steps:
      - name: Generate Summary
        # Results arrive as job env (not inline ${{ }} expansion): the
        # committed script is then executable verbatim in tests, and
        # unquoted expression interpolation cannot reach the shell.
        env:
          SECRETS_RESULT: ${{ needs.secrets-scan.result }}
          DEPENDENCY_RESULT: ${{ needs.dependency-scan.result }}
          CODE_RESULT: ${{ needs.code-security.result }}
          SBOM_RESULT: ${{ needs.sbom.result }}
        run: |
          echo "## Security Scan Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Scan Type | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Secret Scanning | $SECRETS_RESULT |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Dependency Vulnerabilities | $DEPENDENCY_RESULT |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Code Security | $CODE_RESULT |" >> "$GITHUB_STEP_SUMMARY"
          echo "| SBOM Generation | $SBOM_RESULT |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          # bash -e safe: explicit if blocks only -- a false condition
          # in a short-circuit `[[ ]] &&` list would abort the step.
          RAN=0
          FAILED=0
          for r in "$SECRETS_RESULT" "$DEPENDENCY_RESULT" "$CODE_RESULT" "$SBOM_RESULT"; do
            if [[ "$r" == "success" ]]; then
              RAN=$((RAN + 1))
            elif [[ "$r" == "skipped" ]]; then
              :  # not selected by the scan_type selector - never gates
            else
              RAN=$((RAN + 1))
              FAILED=1
            fi
          done

          if [[ "$FAILED" == "1" ]]; then
            echo "❌ Some selected security scans failed - please review" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [[ "$RAN" == "0" ]]; then
            echo "❌ No security scan leg ran - selector configuration error" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "✅ All selected security scans passed" >> "$GITHUB_STEP_SUMMARY"
