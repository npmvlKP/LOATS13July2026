# LOATS13July2026 - Security Scanning Workflow
# Runs on schedule and manual trigger for security audits

name: Security Scan

on:
  schedule:
    # Run security scan weekly on Sunday at 3 AM IST
    - cron: '30 21 * * 0'  # 3:00 AM IST = 21:30 UTC Saturday
  workflow_dispatch:
    inputs:
      scan_type:
        description: 'Type of security scan'
        required: true
        default: 'full'
        type: choice
        options:
          - full
          - secrets
          - dependencies
          - code

env:
  TZ: Asia/Kolkata

jobs:
  # ============================================================
  # Secret Scanning with Gitleaks
  # ============================================================
  secrets-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'schedule'
      || (github.event_name == 'workflow_dispatch'
          && (github.event.inputs.scan_type == 'full'
              || github.event.inputs.scan_type == 'secrets'
              || github.event.inputs.scan_type == ''))

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_CONFIG_PATH: .gitleaks.toml
          GITLEAKS_ENABLE_COMMENTS: true
          GITLEAKS_ENABLE_PROPOSAL: true

  # ============================================================
  # Dependency Vulnerability Scanning
  # ============================================================
  dependency-scan:
    name: Dependency Vulnerabilities
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'schedule'
      || (github.event_name == 'workflow_dispatch'
          && (github.event.inputs.scan_type == 'full'
              || github.event.inputs.scan_type == 'dependencies'
              || github.event.inputs.scan_type == ''))

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install pip-audit
        # Pinned to the version the local gates verify against (pyproject
        # dev extra); unpinned installs pulled a CLI-breaking release.
        run: pip install pip-audit==2.10.1

      - name: Run pip-audit
        # pip-audit 2.10.1: --output is the stable long-form. The second
        # view uses --format=markdown: `requirements` was NEVER a valid
        # --format value (valid: columns/json/cyclonedx-json/cyclonedx-xml/
        # markdown, introspected from pip_audit._cli.OutputFormatChoice)
        # and only failed on the runner (dispatch run 34051682117).
        run: |
          pip-audit --format=json --output pip-audit-full.json
          pip-audit --format=markdown --output pip-audit-vulnerable.md

      - name: Upload pip-audit report
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-full-report
          path: |
            pip-audit-full.json
            pip-audit-vulnerable.md
          retention-days: 30

      - name: Fail on critical vulnerabilities
        # Gate on scheduled runs too (scan_type input is empty there)
        if: github.event_name == 'schedule' || github.event.inputs.scan_type == 'full'
        run: |
          if grep -q "CRITICAL" pip-audit-full.json 2>/dev/null; then
            echo "❌ Critical vulnerabilities found!"
            cat pip-audit-full.json
            exit 1
          fi
          echo "✅ No critical vulnerabilities found"

  # ============================================================
  # Code Security Analysis with Bandit
  # ============================================================
  code-security:
    name: Code Security Analysis
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'schedule'
      || (github.event_name == 'workflow_dispatch'
          && (github.event.inputs.scan_type == 'full'
              || github.event.inputs.scan_type == 'code'
              || github.event.inputs.scan_type == ''))

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Install Bandit
        # Pinned: bandit 1.9.4 is the version the local gates run; safety
        # 3.x is capped because v3 removed the v2 CLI flags the report
        # artifact contract expects (same drift class as pip-audit).
        run: pip install "bandit==1.9.4" "safety>=3,<4"

      - name: Run Bandit
        run: |
          bandit -r src/ -c pyproject.toml -f json -o bandit-full-report.json
          bandit -r src/ -c pyproject.toml -f screen

      # safety>=3 dropped the v2 flags (`--json`, `--output-file`); `scan` needs
      # platform auth this workflow does not have. `check --save-json` keeps the
      # artifact contract with the auth-free path (verified: safety 3.8.1).
      - name: Run Safety check
        run: |
          safety check --save-json safety-report.json

      - name: Upload security reports
        uses: actions/upload-artifact@v4
        with:
          name: code-security-reports
          path: |
            bandit-full-report.json
            safety-report.json
          retention-days: 30

      - name: Check for high severity issues
        # Gate on scheduled runs too (scan_type input is empty there)
        if: github.event_name == 'schedule' || github.event.inputs.scan_type == 'full'
        run: |
          HIGH_COUNT=$(grep -o '"high": [0-9]*' bandit-full-report.json | grep -o '[0-9]*' || echo "0")
          if [ "$HIGH_COUNT" -gt 0 ]; then
            echo "❌ $HIGH_COUNT high severity issues found!"
            exit 1
          fi
          echo "✅ No high severity issues found"

  # ============================================================
  # SBOM Generation (Software Bill of Materials)
  # ============================================================
  sbom:
    name: SBOM Generation
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'schedule'
      || (github.event_name == 'workflow_dispatch'
          && (github.event.inputs.scan_type == 'full'
              || github.event.inputs.scan_type == 'dependencies'
              || github.event.inputs.scan_type == ''))

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install CycloneDX
        # Pinned: cyclonedx-bom 7.x removed the `mod` command; the job
        # below uses the documented `requirements -` pip-freeze form
        # verified against 7.3.1.
        run: pip install "cyclonedx-bom==7.3.1"

      - name: Generate SBOM
        # cyclonedx-py 7.x: `mod` is gone (dispatch run 34051682117);
        # `requirements -` consumes a pip freeze listing. Local evidence:
        # JSON and XML outputs both verified against the repo venv freeze.
        run: |
          python -m pip freeze --all | cyclonedx-py requirements - -o sbom.json
          python -m pip freeze --all | cyclonedx-py requirements - -o sbom.xml --of XML

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: |
            sbom.json
            sbom.xml
          retention-days: 90

      - name: Upload SBOM to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: sbom-github
          path: sbom.json
          retention-days: 365

  # ============================================================
  # Summary Report
  # ============================================================
  summary:
    name: Security Scan Summary
    runs-on: ubuntu-latest
    needs: [secrets-scan, dependency-scan, code-security, sbom]
    if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')

    steps:
      - name: Generate Summary
        run: |
          echo "## Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Scan Type | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Secret Scanning | ${{ needs.secrets-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Dependency Vulnerabilities | ${{ needs.dependency-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Code Security | ${{ needs.code-security.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| SBOM Generation | ${{ needs.sbom.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [[ "${{ needs.secrets-scan.result }}" == "success" ]] && \
             [[ "${{ needs.dependency-scan.result }}" == "success" ]] && \
             [[ "${{ needs.code-security.result }}" == "success" ]]; then
            echo "✅ All security scans passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Some security scans failed - please review" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi