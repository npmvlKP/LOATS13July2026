[project]
name = "loats13july2026"
version = "0.1.0"
description = "Lite OpenAlgo Trading System"
authors = [{name = "npmvlKP", email = "npmvlKP@gmail.com"}]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openalgo>=0.1.0",
    "httpx>=0.28.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "APScheduler>=3.10.0",
    "ta>=0.11.0",
    "vollib>=1.0.1",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scipy>=1.13.0",
    "vaderSentiment>=3.3.2",
    "feedparser>=6.0.0",
    "structlog>=23.2.0",
    "python-telegram-bot>=20.7.0",
    "python-dotenv>=1.0.0",
    "newspaper4k>=0.9.3",
    "cachetools>=5.3.0",
    "prometheus-client>=0.21.0"
]

[project.optional-dependencies]
dev = [
    "pandas-stubs>=2.2.0.240625",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "black>=24.0.0",
    "isort>=5.13.0",
    "flake8>=7.0.0",
    "bandit>=1.7.0",
    "pip-audit>=2.7.0",
    "pre-commit>=3.7.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/loats"]

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = ["*.env", ".ruff_cache"]

[tool.ruff.lint.mccabe]
max-complexity = 20

[tool.ruff.lint]
select = ["E", "F", "W", "C90", "I", "N", "UP", "B", "A", "C4", "DTZ", "EXE", "FA", "ICN", "INP", "PIE", "T20", "PTH", "PGH", "RUF"]
ignore = ["E501", "S101", "RUF001", "RUF002", "RUF003", "RUF005", "RUF006", "RUF012", "RUF015", "RUF022", "RUF059", "N803", "N806", "N818", "INP001", "PIE790", "PGH003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "DTZ001", "DTZ005", "BLE001", "SLF001", "PLC0415", "T201", "ANN001", "ANN201", "ANN202", "PT001", "PT011", "PT012", "ARG001", "PTH123", "PLR0915", "E501"]
"quick_health_check.py" = ["INP001", "T201"]
"setup_project.py" = ["INP001", "T201"]
"scripts/*" = ["INP001", "T201"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = false
warn_no_return = true
warn_unreachable = false
strict_equality = true
disallow_any_generics = false
disallow_subclassing_any = true
disallow_untyped_calls = false
explicit_package_bases = true
exclude = ["tests/"]
namespace_packages = true

[[tool.mypy.overrides]]
module = "feedparser.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "newspaper.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "vaderSentiment.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "apscheduler.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "vollib.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "numba.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pandas.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "httpx.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v"

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "*/__init__.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.bandit]
skips = ["B101"]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["loats"]